# Requires a .env file. POSTGRES_PASSWORD has no default on purpose.
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: peerconnect
      POSTGRES_DB: peerconnect
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peerconnect"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://peerconnect:${POSTGRES_PASSWORD}@db:5432/peerconnect
      TRUST_PROXY: "1"
    ports:
      - "4000:4000"
    volumes:
      - uploads:/data/storage

volumes:
  db-data:
  uploads:
